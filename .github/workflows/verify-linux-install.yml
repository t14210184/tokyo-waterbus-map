name: Verify Linux npm ci

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/verify-linux-install.yml

permissions:
  contents: read

jobs:
  verify-linux-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
